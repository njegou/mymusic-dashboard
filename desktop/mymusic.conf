--[[ mymusic — panneau de bureau
     Affiche l'état du serveur mymusic sur le fond d'écran.
     Lancement : conky -c ~/.config/conky/mymusic.conf
]]

conky.config = {

    -- Fenêtre ----------------------------------------------------------
    own_window = true,
    own_window_type = 'desktop',        -- voir README si l'panneau passe au-dessus des fenêtres
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'Conky',
    own_window_title = 'mymusic-panel',

    -- Position ---------------------------------------------------------
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 60,
    minimum_width = 260,
    maximum_width = 300,

    -- Rendu ------------------------------------------------------------
    double_buffer = true,
    use_xft = true,
    font = 'JetBrains Mono:size=9',
    xftalpha = 1,
    override_utf8_locale = true,
    draw_shades = true,                 -- lisible même sur un fond clair
    default_shade_color = '#000000',
    draw_outline = false,
    draw_borders = false,
    border_inner_margin = 0,
    border_outer_margin = 0,
    uppercase = false,
    use_spacer = 'none',

    -- Palette (reprend le mode sombre du tableau de bord) ---------------
    default_color = '#E4E6E3',
    color0 = '#E4E6E3',                 -- valeurs
    color1 = '#8FB4D6',                 -- titres
    color2 = '#9AA0A6',                 -- libellés
    color3 = '#6CC295',                 -- normal
    color4 = '#D6A648',                 -- attention
    color5 = '#E2796A',                 -- problème

    -- Boucle -----------------------------------------------------------
    update_interval = 5.0,
    total_run_times = 0,
    cpu_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
}

-- Le script interroge l'API toutes les 30 s : conky redessine plus souvent,
-- mais une seule requête HTTP part par demi-minute.
conky.text = [[
${execpi 30 python3 ~/.config/conky/panel.py --text}
]]
